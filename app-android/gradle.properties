# Gradle 构建参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX（Compose 必需）
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ⚠️ 工程路径含中文（F:\智慧农场\程序\app-android），AGP 默认会直接拒绝构建：
#     "Your project path contains non-ASCII characters. This will most likely cause
#      the build to fail on Windows."
# 这是 2015 年 b.android.com/95744 留下的检查。本项目**实测**该路径下能否构建：
# 若后续在 aapt2/d8/NDK 处出现路径相关的怪错误，就说明检查是对的，
# 必须把工程移到纯 ASCII 路径（例如 F:\smartfarm\app-android）。
android.overridePathCheck=true
